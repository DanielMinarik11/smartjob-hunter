<section class="hero">
  <h1>SmartJob <span class="highlight">Hunter</span></h1>
  <p>Tvoj osobný asistent pri hľadaní práce z Jooble</p>

  <div class="filters-card">
    <div class="filter-row">
      <label>Hľadať pozíciu</label>
      <input type="text" [(ngModel)]="keywords" placeholder="napr. vývojár, účtovník" />
    </div>

    <div class="filter-row">
      <label>Mesto / región</label>
      <input type="text" [(ngModel)]="location" placeholder="napr. Bratislava" />
    </div>

    <div class="filter-row">
      <label>Minimálna mzda</label>
      <input type="number" [(ngModel)]="minSalary" placeholder="€" />
    </div>

    <div class="filter-row">
      <label>Maximálna mzda</label>
      <input type="number" [(ngModel)]="maxSalary" placeholder="€" />
    </div>

    <div class="filter-actions">
      <button class="btn-primary" (click)="loadJobsFromJooble()" [disabled]="isLoading()">
        {{ isLoading() ? 'Načítavam...' : 'Vyhľadať' }}
      </button>
      <button class="btn-outline" (click)="clearFilters()">Vymazať filtre</button>
    </div>
  </div>
</section>

<section class="results">
  <p *ngIf="errorMessage()" class="error">{{ errorMessage() }}</p>
  <p *ngIf="!isLoading() && filteredJobs().length === 0">Žiadne výsledky pre zadané kritériá.</p>

  <div class="job-grid">
    <article *ngFor="let job of filteredJobs()" class="job-card">
      <div class="card-body">
        <h3>{{ job.title }}</h3>
        <p class="company">{{ job.company }}</p>
        <p class="location">{{ job.location }}</p>
        <p class="salary">{{ job.salary }}</p>
        <p class="date-posted">Zverejnené: {{ job.datePosted | date }}</p>
      </div>
    </article>
  </div>
</section>
